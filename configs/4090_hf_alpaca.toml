# 原生 generate 的固定长度基线；模型和输入路径相对于本文件。
[experiment]
name = "qwen15b-4090-hf-alpaca"
dataset = "../data/baseline-v1/alpaca.jsonl"
output_dir = "../outputs"
warmup = 5
repeats = 3
seed = 42

[backend]
name = "transformers"
model = "../models/Qwen2.5-1.5B-Instruct"
revision = "main"
device = "cuda:0"
dtype = "bfloat16"
attention = "sdpa"
generation_path = "hf_generate"
chat_template = true
stop_on_eos = false
local_files_only = true
max_input_tokens = 4096

[generation]
max_new_tokens = 128
