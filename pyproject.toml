[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ainference-optim"
version = "0.1.0"
description = "Reproducible experiments for autoregressive decoding optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2"]
inference = ["torch==2.9.0", "transformers==4.57.1"]

[project.scripts]
ainfer = "ainference_optim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".local-tools", ".venv-4090"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
